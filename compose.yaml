# Development stack. Copy .env.example to .env before the first run.
name: jolo-market

services:
  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - php
      - frontend

  # Vite dev server with HMR. nginx proxies every non-/api path to it.
  frontend:
    image: node:26.13.0-alpine
    working_dir: /app
    # Runs as root so it can write the named node_modules volume; it writes nothing else
    # to the bind mount.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./frontend:/app
      # Keeps the container's Linux node_modules apart from the host's. If frontend/node_modules
      # does not exist yet, Docker creates it on the host as root: run `npm ci` on the host first.
      - frontend-node-modules:/app/node_modules

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    # While there are no users, print the one-time first-admin setup code in the logs (PD-14).
    # It must never stop php-fpm from starting (no vendor/ or migrations yet on a fresh clone).
    command:
      - sh
      - -c
      - php bin/console app:setup:ensure-code --no-interaction || echo "Setup code not generated yet; run the migrations and restart php."; exec php-fpm
    volumes:
      - ./backend:/var/www/backend
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=9.7.4&charset=utf8mb4"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  # Runs scheduled jobs (catalog ingestion, INGESTION_SCHEDULE; price history prune, PRICE_HISTORY_PRUNE_SCHEDULE). Same image and code as php.
  # The time limit makes it restart regularly, so it picks up code and config changes.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600"]
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=9.7.4&charset=utf8mb4"
      XDEBUG_MODE: "off"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:9.7.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  frontend-node-modules:
