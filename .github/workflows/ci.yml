name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same PHP image and MySQL init scripts as in development (compose.yaml).
      - name: Prepare the Compose environment
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env

      - name: Start php and mysql
        run: docker compose up -d --build --wait php mysql

      - name: Install dependencies
        run: docker compose exec -T php composer install --no-interaction --no-progress

      - name: composer check
        run: docker compose exec -T php composer check

      - name: Show container logs
        if: failure()
        run: docker compose logs

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: npm run check
        run: npm run check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the Compose environment
        run: |
          cp .env.example .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env

      - name: Start the stack
        run: |
          docker compose up -d --build --wait php mysql
          docker compose exec -T php composer install --no-interaction --no-progress
          docker compose up -d

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for the SPA and the API
        run: |
          timeout 180 sh -c 'until curl -sf http://localhost:8080/ > /dev/null; do sleep 3; done'
          curl -sf http://localhost:8080/api/health

      - name: npm run test:e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs
