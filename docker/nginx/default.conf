server {
    listen 80;
    server_name _;

    root /var/www/backend/public;

    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        internal;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }

    # The frontend dev server is wired in a later PR.
    location / {
        return 404;
    }
}
