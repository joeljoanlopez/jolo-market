# Production server (E6.5). The development one is default.conf.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # The built SPA. No PHP file lives here: php-fpm has the backend in its own image.
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        # Appends the address nginx sees. With SYMFONY_TRUSTED_PROXIES=private_ranges, Symfony takes the last
        # untrusted address of the chain, so a client cannot spoof its IP with its own X-Forwarded-For.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Vite puts a content hash in every file name under assets/, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a client route of the SPA. index.html is revalidated on every load, so a deploy is seen at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
