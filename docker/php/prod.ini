; Production only (E6.1). The code never changes inside the image, so OPcache does not check files for changes.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
display_errors = Off
; Sessions live in a named volume (compose.prod.yaml), so a deploy that recreates the container keeps users logged in
; (PD-37). Symfony uses the native handler with this path, as no handler_id or save_path is configured.
session.save_path = /var/www/backend/var/sessions
