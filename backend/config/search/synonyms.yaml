# Spanish <-> Catalan dictionary of product search (PD-101, PD-102, PD-126).
#
# Each line is a group of equivalent words. When a searched word is a whole word of a group, the other words of the
# group are searched too, each as the start of a word: "leche" also finds "Llet sencera", "pa" also finds "Pan de
# molde". A word that is only the start of an entry ("lec") gets no equivalent.
#
# Rules (the reindex stops with a clear message otherwise): two or more words per group, one word each (no spaces or
# hyphens), and no word in two groups. Case and accents do not matter. Add singular and plural forms.
# A change takes effect after the next reindex (make reindex, or the next ingestion run).

