services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # One adapter per supermarket chain (PD-1). Each one is picked up by the ingestion handler.
        App\Catalog\Domain\Port\SupermarketCatalogSource:
            tags: ['catalog.supermarket_source']

    App\Catalog\:
        resource: '../../src/Catalog/'
        # Development-only code (PD-53, PD-57) is registered in when@dev below.
        exclude:
            - '../../src/Catalog/Infrastructure/Source/Dummy/'
            - '../../src/Catalog/Infrastructure/Dev/'

    App\Catalog\Application\IngestCatalog\IngestCatalogHandler:
        arguments:
            $sources: !tagged_iterator catalog.supermarket_source

    # HTTP client for supermarket adapters (E1.19, PD-26). Adapters receive '@catalog.http_client'.
    App\Catalog\Infrastructure\Http\CatalogHttpOptions:
        arguments:
            $userAgent: '%env(string:CATALOG_HTTP_USER_AGENT)%'
            $delayBetweenRequestsInMilliseconds: 1000
            $maxRetries: 3
            $firstRetryDelayInMilliseconds: 1000
            $timeoutInSeconds: 10.0
            $maxDurationInSeconds: 30.0

    catalog.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Catalog\Infrastructure\Http\CatalogHttpClientFactory', 'create']
        arguments:
            - '@http_client'
            - '@App\Catalog\Infrastructure\Http\CatalogHttpOptions'
            - '@App\Shared\Domain\Clock'
            - '@App\Catalog\Infrastructure\Http\Sleeper'

    App\Catalog\Infrastructure\Ingestion\EnvIngestionSettings:
        arguments:
            $postalCode: '%env(string:INSTANCE_POSTAL_CODE)%'
            $enabledSupermarkets: '%env(string:ENABLED_SUPERMARKETS)%'

    # Boot-time check (E6.4): a missing variable must be reported, not throw, so it reads null instead.
    App\Catalog\Infrastructure\Configuration\CatalogConfigurationCheck:
        arguments:
            $postalCode: '%env(default::INSTANCE_POSTAL_CODE)%'
            $enabledSupermarkets: '%env(default::ENABLED_SUPERMARKETS)%'
            $sources: !tagged_iterator catalog.supermarket_source

when@test:
    services:
        test.catalog.search_products_handler:
            alias: App\Catalog\Application\SearchProducts\SearchProductsHandler
            public: true
        test.catalog.prune_price_history_handler:
            alias: App\Catalog\Application\PrunePriceHistory\PrunePriceHistoryHandler
            public: true
        test.catalog_http_client:
            alias: catalog.http_client
            public: true
        # Fake sources: functional tests never call a real supermarket.
        # Decorates (replaces) the real adapter, which keeps its tag, so it is never called in tests.
        test.catalog_source.mercadona:
            class: App\Tests\Support\Catalog\ConfigurableCatalogSource
            decorates: App\Catalog\Infrastructure\Source\Mercadona\MercadonaCatalogSource
            public: true
            arguments: ['mercadona']
        test.catalog_source.aldi:
            class: App\Tests\Support\Catalog\ConfigurableCatalogSource
            decorates: App\Catalog\Infrastructure\Source\Aldi\AldiCatalogSource
            public: true
            arguments: ['aldi']
        test.catalog_source.bonpreu:
            class: App\Tests\Support\Catalog\ConfigurableCatalogSource
            decorates: App\Catalog\Infrastructure\Source\BonpreuEsclat\BonpreuEsclatCatalogSource
            public: true
            arguments: ['bonpreu']

# Development environment (PD-53, PD-55): offline dummy sources and the price history backfill.
when@dev:
    parameters:
        env(CATALOG_SOURCES): 'dummy'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Catalog\Infrastructure\Dev\:
            resource: '../../src/Catalog/Infrastructure/Dev/'

        # Not tagged catalog.supermarket_source: they replace the real adapters only through catalog.dev.sources.
        catalog.dev.dummy_source.mercadona:
            class: App\Catalog\Infrastructure\Source\Dummy\DummyCatalogSource
            autoconfigure: false
            arguments: ['mercadona', '@App\Shared\Infrastructure\Dev\SettableClock']
        catalog.dev.dummy_source.bonpreu:
            class: App\Catalog\Infrastructure\Source\Dummy\DummyCatalogSource
            autoconfigure: false
            arguments: ['bonpreu', '@App\Shared\Infrastructure\Dev\SettableClock']
        catalog.dev.dummy_source.aldi:
            class: App\Catalog\Infrastructure\Source\Dummy\DummyCatalogSource
            autoconfigure: false
            arguments: ['aldi', '@App\Shared\Infrastructure\Dev\SettableClock']

        catalog.dev.sources:
            class: App\Catalog\Infrastructure\Dev\DevCatalogSources
            arguments:
                $choice: '%env(string:CATALOG_SOURCES)%'
                $real: !tagged_iterator catalog.supermarket_source
                $dummy:
                    - '@catalog.dev.dummy_source.mercadona'
                    - '@catalog.dev.dummy_source.bonpreu'
                    - '@catalog.dev.dummy_source.aldi'

        App\Catalog\Application\IngestCatalog\IngestCatalogHandler:
            arguments:
                $sources: '@catalog.dev.sources'

        # The backfill always ingests the dummy catalog, whatever CATALOG_SOURCES says, with a clock it can move (PD-55).
        catalog.dev.backfill_handler:
            class: App\Catalog\Application\IngestCatalog\IngestCatalogHandler
            arguments:
                $sources:
                    - '@catalog.dev.dummy_source.mercadona'
                    - '@catalog.dev.dummy_source.bonpreu'
                    - '@catalog.dev.dummy_source.aldi'
                $clock: '@App\Shared\Infrastructure\Dev\SettableClock'
