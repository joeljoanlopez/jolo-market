<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jolo-market</title>
    <!--
      Paints the stored theme before the first paint (PD-75). It mirrors resolveTheme() and
      THEME_STORAGE_KEY of src/features/theme; themeBootScript.test.ts keeps them in sync.
    -->
    <script id="theme-boot">
      (function () {
        var preference = 'system';
        try {
          var stored = window.localStorage.getItem('jolo-market.theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (error) {}
        var systemPrefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = preference === 'dark' || (preference === 'system' && systemPrefersDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
